name: YUCE visual QA (desktop & mobile)
on:
  push:
    branches: [main]
    paths:
      - 'sitegen/**'
      - 'public/**'
      - 'build_site.py'
      - 'src/**'
      - '.github/workflows/yuce-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real production site
        run: python scripts/visual_qa.py
        env:
          QA_SITE_URL: https://mtassistant-oozm.onrender.com
      - name: Always upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuce-visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 14
